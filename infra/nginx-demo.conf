# nginx - demo.aibutler.vn -> Smart Choice (port 8100)
# Cai: cp infra/nginx-demo.conf /etc/nginx/sites-available/demo.aibutler.vn
#      ln -s /etc/nginx/sites-available/demo.aibutler.vn /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#      certbot --nginx -d demo.aibutler.vn        <- certbot tu them SSL vao file nay
#
# Vi sao can HTTPS: nut micro (Web Speech API) bi trinh duyet chan tren http://
# thuong - chi chay tren https:// hoac localhost.
#
# File nay la site RIENG, khong dung vao site aibutler.vn dang chay that.

server {
    listen 80;
    server_name demo.aibutler.vn;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;          # du cho luot cham LLM (toi da ~10s)
    }
}
