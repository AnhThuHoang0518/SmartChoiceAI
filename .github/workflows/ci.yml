name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run scenario evaluation (LLM_NHA_CUNG_CAP=luat, no network)
        run: python scripts/danh_gia.py

      - name: Run adversarial-input smoke test (LLM_NHA_CUNG_CAP=luat, no network)
        run: python scripts/thu_cau_quai.py
