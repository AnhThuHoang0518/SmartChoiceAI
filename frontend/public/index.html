<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Choice — Trợ lý tư vấn điện máy</title>
<style>
  :root{--nen:#f4f6f8;--the:#fff;--vien:#e3e8ee;--chinh:#0f6e56;--chinh-nhat:#e1f5ee;--muc:#1a2733;--phu:#5f6e7c;
        --hon:#1d7a43;--kem:#b3541e;--canh-nen:#fdf3ec}
  [data-theme="dark"]{--nen:#12171c;--the:#1c2329;--vien:#2e3a44;--chinh:#2fae8a;--chinh-nhat:#173c31;--muc:#e8edf2;--phu:#93a3b1;
        --hon:#4cc47e;--kem:#e0854a;--canh-nen:#2b2118}
  [data-theme="dark"] input{background:var(--the);color:var(--muc)}
  [data-theme="dark"] dialog{background:var(--the);color:var(--muc)}
  *{box-sizing:border-box;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--nen);color:var(--muc);height:100vh;display:flex;flex-direction:column}
  header{background:var(--the);border-bottom:1px solid var(--vien);padding:14px 20px;display:flex;align-items:center;gap:10px}
  header b{font-size:17px}
  header span{font-size:13px;color:var(--phu)}
  #khung{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
  .dong{display:flex;margin-bottom:14px}
  .dong.khach{justify-content:flex-end}
  .bong{max-width:78%;padding:11px 15px;border-radius:14px;line-height:1.55;font-size:15px;white-space:pre-wrap}
  .khach .bong{background:var(--chinh);color:#fff;border-bottom-right-radius:4px}
  .bot .bong{background:var(--the);border:1px solid var(--vien);border-bottom-left-radius:4px}
  .the-sp{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14px}
  .the-sp b{font-size:15px}
  .hang-to{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gia{color:var(--chinh);font-weight:700;white-space:nowrap}
  .to{margin-top:6px;font-size:13.5px}
  .to .hon{color:var(--hon)}
  .to .kem{color:var(--kem)}
  .badge{display:inline-block;background:var(--chinh-nhat);color:var(--chinh);border-radius:20px;padding:1px 9px;font-size:12px;margin:2px 3px 0 0;cursor:pointer;border:none}
  .badge:hover{filter:brightness(.93)}
  .loai-noi-bat{margin-top:8px;padding:10px 14px;border-left:3px solid var(--kem);background:var(--canh-nen);border-radius:0;font-size:13.5px}
  .giai-trinh{margin-top:6px;font-size:12.5px;color:var(--phu)}
  .giai-trinh span{margin-right:10px}
  form{display:flex;gap:10px;padding:14px 20px;background:var(--the);border-top:1px solid var(--vien)}
  form>div{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
  input{flex:1;padding:12px 16px;border:1px solid var(--vien);border-radius:24px;font-size:15px;outline:none}
  input:focus{border-color:var(--chinh)}
  button.gui{background:var(--chinh);color:#fff;border:none;border-radius:24px;padding:0 22px;font-size:15px;cursor:pointer}
  button.gui:disabled{opacity:.5}
  dialog{border:1px solid var(--vien);border-radius:12px;padding:18px 20px;max-width:380px;font-size:14px}
  dialog h4{margin-bottom:8px}
  dialog table{border-collapse:collapse;width:100%}
  dialog td{padding:3px 6px;border-bottom:1px solid var(--vien);font-size:13px}
  .goi-y{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
  .goi-y button{background:var(--the);border:1px solid var(--vien);border-radius:18px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--muc)}
</style>
</head>
<body>
<header><b>Smart Choice</b><span>· tư vấn theo nhu cầu thật · mọi con số đều có nguồn</span><button id="doi-nen" title="Đổi giao diện sáng/tối" style="margin-left:auto;background:none;border:1px solid var(--vien);border-radius:18px;padding:4px 12px;cursor:pointer;font-size:15px;color:var(--muc)">🌙</button></header>

<div id="khung">
  <div class="dong bot"><div class="bong">Em chào mình ạ! Em tư vấn được 13 ngành hàng: máy lạnh, tủ lạnh, máy giặt, máy sấy, máy rửa chén, tủ đông, máy nước nóng, tablet, đồng hồ, màn hình, PC, máy in, micro. Cứ nói tự nhiên — viết tắt hay không dấu đều được ạ.</div></div>
  <div class="goi-y" id="goiy">
    <button onclick="dienMau(this)">🔥 Máy lạnh nào đang giảm giá?</button>
    <button onclick="dienMau(this)">e muon mua may lanh duoi 20tr cho phong 18m2, tk dien, it on</button>
    <button onclick="dienMau(this)">máy lạnh phòng khách 25m², ưu tiên làm lạnh nhanh</button>
  </div>
</div>

<form onsubmit="gui(event)">
  <div>
    <input id="o-nhap" placeholder="Nhập tin nhắn hoặc bấm 🎤 nói..." autocomplete="off" autofocus>
    <button type="button" class="gui" id="mic" title="Nói tiếng Việt" style="background:#5f6e7c">🎤</button>
    <button class="gui" id="nut">Gửi</button>
  </div>
</form>

<dialog id="hop-nguon"></dialog>

<script>
// Giao dien sang/toi: uu tien lua chon da luu, chua co thi theo he dieu hanh.
const goc = document.documentElement;
const nutNen = document.getElementById('doi-nen');
function apDungNen(t){ goc.dataset.theme = t; nutNen.textContent = t === 'dark' ? '☀️' : '🌙'; }
apDungNen(localStorage.getItem('giao_dien') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
nutNen.onclick = () => {
  const t = goc.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('giao_dien', t); apDungNen(t);
};

let phienId = null;
const khung = document.getElementById('khung');
const oNhap = document.getElementById('o-nhap');
const nut = document.getElementById('nut');

function dienMau(b){
  // Bam nut la GUI luon - bat khach bam Gui them lan nua la thua mot cham.
  oNhap.value = b.textContent.replace(/^\u{1F525}\s*/u, '');
  document.querySelector('form').requestSubmit();
}

function them(html, lop){
  const d = document.createElement('div');
  d.className = 'dong ' + lop;
  d.innerHTML = '<div class="bong">' + html + '</div>';
  khung.appendChild(d);
  khung.scrollTop = khung.scrollHeight;
  return d;
}

function moNguon(n){
  const h = document.getElementById('hop-nguon');
  h.innerHTML = '<h4>Nguồn dữ liệu</h4><table>'
    + '<tr><td>Trường</td><td><b>' + n.truong + '</b></td></tr>'
    + '<tr><td>Giá trị</td><td>' + n.gia_tri + '</td></tr>'
    + '<tr><td>Nguồn</td><td>' + n.nguon + '</td></tr>'
    + '<tr><td>Lấy lúc</td><td>' + n.lay_luc + '</td></tr>'
    + '<tr><td>Mã SP</td><td>' + n.ma_sp + '</td></tr>'
    + (n.suy_luan ? '<tr><td>Lưu ý</td><td>⚠ suy luận từ mô tả, không phải field chính thức</td></tr>' : '')
    + '</table><br><button class="gui" onclick="this.closest(\'dialog\').close()">Đóng</button>';
  h.showModal();
}

function veSanPham(u, i){
  let s = '<div class="the-sp"><div class="hang-to"><b>' + (i+1) + '. ' + u.ten + '</b>'
        + '<span class="gia">' + u.gia.toLocaleString('vi-VN') + 'đ</span></div>';
  (u.hon||[]).forEach(h => s += '<div class="to hon">+ Hơn về ' + h.truc + ': ' + h.cua_minh + ' (so với ' + h.doi_thu + ')</div>');
  (u.kem||[]).forEach(k => s += '<div class="to kem">− Kém về ' + k.truc + ': ' + k.cua_minh + ' (so với ' + k.doi_thu + ')</div>');
  s += '<div>';
  (u.nguon||[]).forEach(n => {
    if (n.gia_tri && n.gia_tri !== 'None')
      s += '<button class="badge" onclick=\'moNguon(' + JSON.stringify(n).replace(/'/g,"&#39;") + ')\'>' + n.truong + ' ⓘ</button>';
  });
  return s + '</div></div>';
}

// Giong noi: Web Speech API cua trinh duyet (Chrome/Edge), nhan vi-VN.
// Khong ton credit, khong can backend. STT cua FPT de danh cho pilot.
const mic = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) { mic.style.display = 'none'; }
else {
  const nghe = new SR();
  nghe.lang = 'vi-VN'; nghe.interimResults = false;
  let dang = false;
  mic.onclick = () => {
    if (dang) { nghe.stop(); return; }
    dang = true; mic.style.background = '#b3541e'; mic.textContent = '●';
    nghe.start();
  };
  nghe.onresult = ev => { oNhap.value = ev.results[0][0].transcript; };
  nghe.onend = () => {
    dang = false; mic.style.background = '#5f6e7c'; mic.textContent = '🎤';
    if (oNhap.value.trim()) document.querySelector('form').requestSubmit();
  };
  nghe.onerror = () => { dang = false; mic.style.background = '#5f6e7c'; mic.textContent = '🎤'; };
}

async function gui(e){
  e.preventDefault();
  const tin = oNhap.value.trim();
  if (!tin) return;
  document.getElementById('goiy')?.remove();
  them(tin.replace(/</g,'&lt;'), 'khach');
  oNhap.value = ''; nut.disabled = true;
  const cho = them('<i>Đang xử lý…</i>', 'bot');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({tin_nhan: tin, phien_id: phienId})
    });
    const d = await r.json();
    phienId = d.phien_id;
    let html = d.text.replace(/</g,'&lt;');

    if (d.loai === 'cau_hoi' && d.vi_sao_hoi?.length){
      html += '<div class="giai-trinh">Vì sao hỏi câu này: '
            + d.vi_sao_hoi.map(x => '<span>' + x.o + ' = ' + x.diem.toFixed(2) + '</span>').join('')
            + '</div>';
    }
    if (d.loai === 'tu_van'){
      (d.top3||[]).forEach((u,i) => html += veSanPham(u,i));
      if (d.loai_noi_bat)
        html += '<div class="loai-noi-bat"><b>Vì sao em không đề xuất ' + d.loai_noi_bat.ten + ':</b> ' + d.loai_noi_bat.chi_tiet + '</div>';
      const t = d.thong_ke || {};
      html += '<div class="giai-trinh"><span>lọc ' + t.truoc_loc + ' → ' + t.sau_loc + ' máy</span>'
            + '<span>' + t.ms + 'ms</span><span>chạm LLM: ' + t.cham_llm + '</span>'
            + (t.so_lan_chan_bia ? '<span>đã chặn bịa: ' + t.so_lan_chan_bia + ' lần</span>' : '') + '</div>';
    }
    cho.querySelector('.bong').innerHTML = html;
  } catch(err){
    cho.querySelector('.bong').innerHTML = 'Lỗi kết nối server — kiểm tra backend đang chạy chưa.';
  }
  nut.disabled = false; oNhap.focus();
  khung.scrollTop = khung.scrollHeight;
}
window.addEventListener('load', () => oNhap.focus());
</script>
</body>
</html>
